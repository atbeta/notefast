services:
  notefast:
    image: xbeta/notefast:0.1.0
    container_name: notefast
    ports:
      - '3140:3140'
    environment:
      - AI_PROVIDER=${AI_PROVIDER:-openrouter}
      - AI_API_KEY=${AI_API_KEY:-}
      # 模型覆盖（可选，预设已包含默认值）
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
      # 鉴权（不设则自动生成 API Key）
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
    volumes:
      - notefast_data:/app/data
      - notefast_export:/app/export
    restart: unless-stopped

  litestream:
    image: litestream/litestream:latest
    container_name: notefast-backup
    command:
      - replicate
      - -config
      - /etc/litestream/litestream.yml
      - -exec
      - 'true'
    environment:
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_REGION=${S3_REGION:-auto}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-false}
    volumes:
      - notefast_data:/data
      - ./litestream.yml:/etc/litestream/litestream.yml:ro
    restart: unless-stopped
    profiles:
      - backup

volumes:
  notefast_data:
  notefast_export:
