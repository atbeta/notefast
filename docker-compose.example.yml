services:
  notefast:
    image: xbeta/notefast:0.1.0
    container_name: notefast
    ports:
      - '3140:3140'
    environment:
      - AI_PROVIDER=${AI_PROVIDER:-openrouter}
      - AI_API_KEY=${AI_API_KEY:-}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
      # 笔记文件夹是权威（vault 是唯一数据形态，RFC 0006）
      - VAULT_PATH=/vault
      # 索引父目录：索引派生到 <父目录>/<sha256(vault 路径) 前12位>
      - NOTEFAST_APP_SUPPORT_DIR=${NOTEFAST_APP_SUPPORT_DIR:-/app/data}
      # watcher 后端启动时自动探测（bind mount 不投递宿主侧事件 → 自动轮询）。
      # 只有要强制指定时才设置：
      # - VAULT_USE_POLLING=true
      # - VAULT_POLL_INTERVAL_MS=1000
    volumes:
      - notefast_data:/app/data
      # 笔记文件夹：必须可写（NoteFast 端编辑会写回 .md）
      - ./notes:/vault
    restart: unless-stopped

# 数据库备份：在 Web 设置页配置 S3 快照（不再使用 Litestream profile）。

volumes:
  notefast_data:
