# NoteFast v0.1.0 Docker 部署
#
# 快速开始：
#   1. 复制 .env.example 为 .env，按需修改
#   2. docker compose up -d
#   3. 访问 http://localhost:3140
#
# 带 S3 备份：
#   1. .env 中填入 S3_* 变量
#   2. docker compose --profile backup up -d

services:
  notefast:
    image: xbeta/notefast:0.1.0
    container_name: notefast
    ports:
      - '3140:3140'
    environment:
      - PORT=3140
      - DATA_DIR=/app/data
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
      - API_TOKEN=${API_TOKEN:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3140}
      - AUTO_EXPORT_DIR=${AUTO_EXPORT_DIR:-/app/export}
      # AI（可选，设 KEY 后启用语义搜索 + 标题生成）
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
    volumes:
      - notefast_data:/app/data
      - notefast_export:/app/export
    restart: unless-stopped

  litestream:
    image: litestream/litestream:latest
    container_name: notefast-backup
    command:
      - replicate
      - -config
      - /etc/litestream/litestream.yml
      - -exec
      - 'true'
    environment:
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_REGION=${S3_REGION:-auto}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-false}
    volumes:
      - notefast_data:/data
      - ./litestream.yml:/etc/litestream/litestream.yml:ro
    restart: unless-stopped
    profiles:
      - backup

volumes:
  notefast_data:
  notefast_export:
