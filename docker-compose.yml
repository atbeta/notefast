services:
  notefast:
    image: ${NOTEFAST_IMAGE:-xbeta/notefast:latest}
    ports:
      - '3140:3140'
    environment:
      - PORT=3140
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
      - API_TOKEN=${API_TOKEN:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3140}
      # 仅显式设置时启用 hourly 全量 Markdown 导出；默认关闭以免大库周期性卡顿
      - AUTO_EXPORT_DIR=${AUTO_EXPORT_DIR:-}
      - AI_PROVIDER=${AI_PROVIDER:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
      # vault mode（kind='vault'）：容器内约定把笔记文件夹挂在 /vault，见下方 volumes
      # Docker Desktop（macOS / Windows）的 bind mount 不投递 inotify 事件，必须开轮询
      # - VAULT_PATH=/vault
      # - VAULT_USE_POLLING=true
      # - VAULT_POLL_INTERVAL_MS=1000
    volumes:
      - notefast_data:/app/data
      - notefast_export:/app/export
      # vault mode：宿主机笔记文件夹 → 容器 /vault（要可写：NoteFast 端编辑会写回文件）
      # - ~/Notes:/vault
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /run
    mem_limit: 512m
    cpus: '1.0'
    pids_limit: 200

# 数据库灾备已改为应用内 S3 快照（设置页 → 数据库备份）。
# 旧 Litestream profile 已移除：其 `replicate -exec true` 会导致复制进程立即退出。

volumes:
  notefast_data:
  notefast_export:
