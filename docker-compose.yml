services:
  notefast:
    image: ${NOTEFAST_IMAGE:-xbeta/notefast:latest}
    ports:
      - '3140:3140'
    environment:
      - PORT=3140
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
      - API_TOKEN=${API_TOKEN:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3140}
      - AUTO_EXPORT_DIR=${AUTO_EXPORT_DIR:-/app/export}
      - AI_PROVIDER=${AI_PROVIDER:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
    volumes:
      - notefast_data:/app/data
      - notefast_export:/app/export
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /run
    mem_limit: 512m
    cpus: '1.0'
    pids_limit: 200

# 数据库灾备已改为应用内 S3 快照（设置页 → 数据库备份）。
# 旧 Litestream profile 已移除：其 `replicate -exec true` 会导致复制进程立即退出。

volumes:
  notefast_data:
  notefast_export:
