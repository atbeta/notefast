services:
  notefast:
    build: .
    ports:
      - '3140:3140'
    environment:
      - PORT=3140
      - DATA_DIR=/app/data
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
      - API_TOKEN=${API_TOKEN:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3140}
      - AUTO_EXPORT_DIR=${AUTO_EXPORT_DIR:-/app/export}
    volumes:
      - notefast_data:/app/data
      - notefast_export:/app/export
    restart: unless-stopped

  litestream:
    image: litestream/litestream:latest
    command:
      - replicate
      - -config
      - /etc/litestream/litestream.yml
      - -exec
      - 'true'
    environment:
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_REGION=${S3_REGION:-auto}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-false}
    volumes:
      - notefast_data:/data
      - ./litestream.yml:/etc/litestream/litestream.yml:ro
    restart: unless-stopped
    profiles:
      - backup

volumes:
  notefast_data:
  notefast_export:
