name: macOS Client

# 仅 PR 冒烟（swift test + assemble 验证）；签名/公证发布只在打 v tag 时由 macos-release.yml 执行
on:
  pull_request:
    paths: ['clients/**']

concurrency:
  group: macos-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # release-please 的版本同步 PR（diff 含 clients/tauri/package.json 等版本文件）
    # 不是真实的客户端改动，跳过冒烟，避免白跑整套 assemble/打包
    if: github.head_ref != 'release-please--branches--main--components--notefast'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Swift tests (clients/apple)
        working-directory: clients/apple
        run: swift test

      - name: Build web-dist
        run: bun --filter @notefast/web build

      - name: Build engine artifact
        run: bun run build:engine

      - name: Assemble NoteFast.app (ad-hoc)
        working-directory: clients/apple
        run: ./scripts/assemble-app.sh --no-build

      - name: Verify bundle signature
        working-directory: clients/apple
        # ad-hoc（无 --sign）模式产物名是 NoteFast Dev.app（见 assemble-app.sh），
        # 只有 Developer ID 签名模式才叫 NoteFast.app——路径必须匹配，否则 100% 失败
        run: codesign --verify --deep --strict "dist/NoteFast Dev.app" && test -x "dist/NoteFast Dev.app/Contents/Resources/engine/notefast-server"
