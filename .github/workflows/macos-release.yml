name: macOS Release (sign + notarize)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sign-notarize:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web-dist
        run: bun --filter @notefast/web build

      - name: Build engine artifact
        run: bun run build:engine

      - name: Swift tests (clients/apple)
        working-directory: clients/apple
        run: swift test

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="build.keychain"
          # 容忍 secret 内的换行/空白（历史踩坑：base64 文本粘进 secret 时被拆行导致 decode 失败）
          echo "$APPLE_CERTIFICATE" | tr -d '[:space:]' | base64 --decode > /tmp/cert.p12
          test -s /tmp/cert.p12 || { echo "证书解码失败：APPLE_CERTIFICATE 不是有效的 base64 p12" >&2; exit 1; }
          security create-keychain -p "temp" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "temp" "$KEYCHAIN"
          security import /tmp/cert.p12 -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "temp" "$KEYCHAIN"

      - name: Assemble + Developer ID sign
        working-directory: clients/apple
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          ./scripts/assemble-app.sh --no-build --sign "$APPLE_SIGNING_IDENTITY"
          codesign --verify --deep --strict dist/NoteFast.app

      - name: Notarize + staple
        working-directory: clients/apple/dist
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ditto -c -k --keepParent NoteFast.app NoteFast.zip
          xcrun notarytool submit NoteFast.zip \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_PASSWORD" --wait \
            2>&1 | tee /tmp/notary.out
          SUBMISSION_ID=$(grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' /tmp/notary.out | head -1)
          STATUS=$(grep -iE 'status: (accepted|invalid|in progress)' /tmp/notary.out | tail -1 | sed 's/.*status: //I' | tr '[:upper:]' '[:lower:]')
          echo "notary status: ${STATUS} (id: ${SUBMISSION_ID})"
          if [ "$STATUS" != "accepted" ]; then
            if [ -n "$SUBMISSION_ID" ]; then
              echo "=== notarytool log（拒绝原因）==="
              xcrun notarytool log "$SUBMISSION_ID" \
                --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_PASSWORD" || true
            fi
            exit 1
          fi
          xcrun stapler staple NoteFast.app
          spctl --assess --type execute --verbose=4 NoteFast.app

      - name: Build + notarize DMG
        working-directory: clients/apple/dist
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ../scripts/make-dmg.sh NoteFast.app NoteFast.dmg
          # DMG 是最外层分发容器：Gatekeeper 检查它自己的公证票据
          xcrun notarytool submit NoteFast.dmg \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_PASSWORD" --wait \
            2>&1 | tee /tmp/notary-dmg.out
          STATUS=$(grep -iE 'status: (accepted|invalid|in progress)' /tmp/notary-dmg.out | tail -1 | sed 's/.*status: //I' | tr '[:upper:]' '[:lower:]')
          echo "dmg notary status: ${STATUS}"
          [ "$STATUS" = "accepted" ] || exit 1
          xcrun stapler staple NoteFast.dmg
          spctl --assess --type open --context context:primary-signature --verbose=4 NoteFast.dmg

      - name: Attach to GitHub Release
        if: github.ref_type == 'tag'
        working-directory: clients/apple/dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          # release-please 与 tag 推送并发，等 Release 对象出现（最多 150s）
          for i in $(seq 1 30); do
            gh release view "$TAG" >/dev/null 2>&1 && break
            sleep 5
          done
          gh release view "$TAG" >/dev/null 2>&1 || { echo "Release $TAG 未找到" >&2; exit 1; }
          gh release upload "$TAG" NoteFast.dmg NoteFast.zip --clobber

      - name: Upload signed app
        uses: actions/upload-artifact@v4
        with:
          name: NoteFast-macos-${{ github.ref_name }}
          path: |
            clients/apple/dist/NoteFast.zip
            clients/apple/dist/NoteFast.dmg
            clients/apple/dist/NoteFast.app
          if-no-files-found: error
