name: macOS Release (sign + notarize)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sign-notarize:
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web-dist
        run: bun --filter @notefast/web build

      - name: Build engine artifact
        run: bun run build:engine

      - name: Swift tests (clients/apple)
        working-directory: clients/apple
        run: swift test

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="build.keychain"
          echo "$APPLE_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "temp" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "temp" "$KEYCHAIN"
          security import /tmp/cert.p12 -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "temp" "$KEYCHAIN"

      - name: Assemble + Developer ID sign
        working-directory: clients/apple
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          ./scripts/assemble-app.sh --no-build --sign "$APPLE_SIGNING_IDENTITY"
          codesign --verify --deep --strict dist/NoteFast.app

      - name: Notarize + staple
        working-directory: clients/apple/dist
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ditto -c -k --keepParent NoteFast.app NoteFast.zip
          xcrun notarytool submit NoteFast.zip \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_PASSWORD" --wait
          xcrun stapler staple NoteFast.app
          spctl --assess --type execute --verbose=4 NoteFast.app

      - name: Upload signed app
        uses: actions/upload-artifact@v4
        with:
          name: NoteFast-macos-${{ github.ref_name }}
          path: |
            clients/apple/dist/NoteFast.zip
            clients/apple/dist/NoteFast.app
          if-no-files-found: error
