name: Windows Release (installer)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-installer:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web-dist
        run: bun --filter @notefast/web build

      - name: Build engine artifact
        run: bun run build:engine

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/tauri/src-tauri

      - name: Prepare engine resources
        # tauri-build 的 generate_context 会校验 bundle.resources 存在，
        # 必须在任何 cargo 编译前把 dist-engine 复制进 src-tauri/resources/engine
        working-directory: clients/tauri
        run: bun run prepare:engine

      - name: Build NSIS installer
        working-directory: clients/tauri
        run: |
          # clients/tauri 非 bun workspace 包，必须单独安装（@tauri-apps/cli 在 node_modules/.bin）
          bun install
          bun run build

      - name: Attach to GitHub Release
        if: github.ref_type == 'tag'
        working-directory: clients/tauri/src-tauri/target/release/bundle/nsis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $TAG = "${{ github.ref_name }}"
          # release-please 与 tag 推送并发，等 Release 对象出现（最多 150s）
          for ($i = 0; $i -lt 30; $i++) {
            if (gh release view $TAG 2>$null) { break }
            Start-Sleep -Seconds 5
          }
          gh release view $TAG 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Error "Release $TAG 未找到"; exit 1 }
          gh release upload $TAG *.exe --clobber

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: NoteFast-windows-${{ github.ref_name }}
          path: clients/tauri/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
