name: Windows Release (installer)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-installer:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web-dist
        run: bun --filter @notefast/web build

      - name: Build engine artifact
        run: bun run build:engine

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/tauri/src-tauri

      - name: Prepare engine resources
        # tauri-build 的 generate_context 会校验 bundle.resources 存在，
        # 必须在任何 cargo 编译前把 dist-engine 复制进 src-tauri/resources/engine
        working-directory: clients/tauri
        run: bun run prepare:engine

      - name: Build NSIS installer + app bundle
        working-directory: clients/tauri
        run: |
          # clients/tauri 非 bun workspace 包，必须单独安装（@tauri-apps/cli 在 node_modules/.bin）
          bun install
          # tauri.conf.json 的 bundle.targets = ["nsis", "app"] —— 同一次构建同时产出
          # NSIS 安装包（用户首次安装）和 app bundle（裸 exe，用于便携 zip）。
          bun run build

      - name: Attach NSIS installer to GitHub Release
        if: github.ref_type == 'tag'
        working-directory: clients/tauri/src-tauri/target/release/bundle/nsis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $TAG = "${{ github.ref_name }}"
          # release-please 与 tag 推送并发，等 Release 对象出现（最多 150s）
          for ($i = 0; $i -lt 30; $i++) {
            if (gh release view $TAG 2>$null) { break }
            Start-Sleep -Seconds 5
          }
          gh release view $TAG 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Error "Release $TAG 未找到"; exit 1 }
          gh release upload $TAG *.exe --clobber

      - name: Build portable zip (app bundle + marker + README)
        # 不 gate 在 tag 上：手动 dispatch 也能出 zip 供上上传到 GitHub release
        # （tag 情况下多一个 gh release upload 步骤）
        # 用 $GITHUB_WORKSPACE + cd 脚本里：不走 working-directory，避免 bash step
        # 在 windows-latest runner 上被传 Windows 路径却吃 Unix 斜杠——上面那个
        # dispatch 报 "The directory name is invalid" 就是这个原因
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/clients/tauri/src-tauri/target/release/bundle/app"
          TAG="${{ github.ref_name }}"
          # ZIP 名形如 NoteFast-0.56.0-portable-windows.zip
          ZIP="NoteFast-${TAG#v}-portable-windows.zip"
          # 便携模式标记文件 —— 壳层读到它就走同目录 data/，不再是 AppData
          : > notefast-portable
          # README（随 zip 走，用户解压能看到）
          cat > README-PORTABLE.txt <<EOF
          NoteFast 便携版 ${TAG}

          解压后直接运行 notefast.exe 即可。数据（含文档、设置、图床缓存）会保存在
          notefast.exe 同目录下的 data/ 文件夹里。整个文件夹可随时复制 / U 盘携带 / 备份。

          注意：
            · 不要删除 notefast-portable 文件 —— 它是便携模式标记
            · 便携版不自动更新；新版本请到 GitHub Releases 手动下
            · 如要重装为标准版，卸载后到 %APPDATA%\com.notefast.desktop 删数据
          EOF
          # 7z 在 windows-latest runner 上默认安装；用 7z 压缩快且免依赖
          7z a -r "$ZIP" notefast.exe notefast-portable README-PORTABLE.txt
          echo "=== portable zip ===" && ls -la "$ZIP"
          gh release upload "$TAG" "$ZIP" --clobber

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoteFast-windows-installer-${{ github.ref_name }}
          path: clients/tauri/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14
          if-no-files-found: error

      - name: Upload portable zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoteFast-windows-portable-${{ github.ref_name }}
          path: clients/tauri/src-tauri/target/release/bundle/app/NoteFast-*-portable-windows.zip
          retention-days: 14
          if-no-files-found: error
