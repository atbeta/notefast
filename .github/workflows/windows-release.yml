name: Windows Release (installer)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-installer:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web-dist
        run: bun --filter @notefast/web build

      - name: Build engine artifact
        run: bun run build:engine

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/tauri/src-tauri

      - name: Prepare engine resources
        # tauri-build 的 generate_context 会校验 bundle.resources 存在，
        # 必须在任何 cargo 编译前把 dist-engine 复制进 src-tauri/resources/engine
        working-directory: clients/tauri
        run: bun run prepare:engine

      - name: Build NSIS installer
        working-directory: clients/tauri
        run: |
          # clients/tauri 非 bun workspace 包，必须单独安装（@tauri-apps/cli 在 node_modules/.bin）
          bun install
          # tauri.conf.json bundle.targets = ["nsis"]；便携 zip 另取 target/release 裸 exe
          bun run build

      - name: Attach NSIS installer to GitHub Release
        if: github.ref_type == 'tag'
        working-directory: clients/tauri/src-tauri/target/release/bundle/nsis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $TAG = "${{ github.ref_name }}"
          # release-please 与 tag 推送并发，等 Release 对象出现（最多 150s）
          for ($i = 0; $i -lt 30; $i++) {
            if (gh release view $TAG 2>$null) { break }
            Start-Sleep -Seconds 5
          }
          gh release view $TAG 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Error "Release $TAG 未找到"; exit 1 }
          gh release upload $TAG *.exe --clobber

      - name: Build portable zip (exe + engine + marker + README)
        # 不 gate 在 tag 上：手动 dispatch 也能出 zip artifact。
        # Tauri 2 Windows 不产出 bundle/app/；裸壳在 target/release/notefast-tauri.exe。
        # NSIS 安装布局（installer.nsi）：$INSTDIR/{主程序, engine/...}，resource_dir=安装目录。
        # 便携包必须镜像同布局——只打裸 exe（~9MB）缺 engine（~60MB）会启动失败。
        # GITHUB_WORKSPACE 在 bash 是 Windows 混斜杠路径，先 cd workspace 再相对路径。
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          TAG="${{ github.ref_name }}"
          ZIP_NAME="NoteFast-${TAG#v}-portable-windows.zip"
          RELEASE_DIR="clients/tauri/src-tauri/target/release"
          ENGINE_SRC="clients/tauri/src-tauri/resources/engine"
          STAGE="clients/tauri/src-tauri/target/portable-stage"

          ls -la "$RELEASE_DIR"/notefast*.exe
          test -f "$ENGINE_SRC/notefast-server.exe" || {
            echo "engine 缺失: $ENGINE_SRC（prepare:engine 未跑或失败）" >&2
            exit 1
          }

          rm -rf "$STAGE"
          mkdir -p "$STAGE/engine"
          # cargo name → 用户可见名
          cp "$RELEASE_DIR/notefast-tauri.exe" "$STAGE/notefast.exe"
          # 与 NSIS $INSTDIR/engine 同布局；壳 resolve_engine_dir = resource_dir/engine
          cp -R "$ENGINE_SRC"/. "$STAGE/engine/"
          : > "$STAGE/notefast-portable"
          cat > "$STAGE/README-PORTABLE.txt" <<EOF
          NoteFast 便携版 ${TAG}

          解压后直接运行 notefast.exe 即可。数据（含文档、设置、图床缓存）会保存在
          notefast.exe 同目录下的 data/ 文件夹里。整个文件夹可随时复制 / U 盘携带 / 备份。

          注意：
            · 不要删除 notefast-portable 文件 —— 它是便携模式标记
            · 不要删除 engine/ 目录 —— 内嵌服务端，缺了应用起不来
            · 便携版不自动更新；新版本请到 GitHub Releases 手动下
            · 如要重装为标准版，卸载后到 %APPDATA%\com.notefast.desktop 删数据
          EOF

          # 在 stage 内打包，保证 zip 根即运行目录（无多余父目录）
          (
            cd "$STAGE"
            7z a -tzip "$ZIP_NAME" notefast.exe engine notefast-portable README-PORTABLE.txt
          )
          mv "$STAGE/$ZIP_NAME" "$RELEASE_DIR/$ZIP_NAME"

          # 体积门禁：裸壳 zip ~2.6MB；含 engine 应接近 NSIS 量级（数十 MB）
          ZIP_BYTES=$(wc -c < "$RELEASE_DIR/$ZIP_NAME" | tr -d ' ')
          echo "=== portable zip ===" && ls -la "$RELEASE_DIR/$ZIP_NAME"
          if [ "$ZIP_BYTES" -lt 20000000 ]; then
            echo "portable zip 过小 (${ZIP_BYTES} bytes)——疑似未打入 engine" >&2
            exit 1
          fi

      # artifact 先于 release upload：即便后续 attach 失败，仍能从 Actions 拿到产物
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoteFast-windows-installer-${{ github.ref_name }}
          path: clients/tauri/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14
          if-no-files-found: error

      - name: Upload portable zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoteFast-windows-portable-${{ github.ref_name }}
          path: clients/tauri/src-tauri/target/release/NoteFast-*-portable-windows.zip
          retention-days: 14
          if-no-files-found: error

      - name: Attach portable zip to GitHub Release
        # 只 tag 跑：dispatch 没 release 可上传
        # 注意：本 step 用 shell: bash，等待循环必须是 bash 语法；
        # 勿从上面 NSIS step（默认 pwsh）复制 for ($i=...) / Start-Sleep。
        if: github.ref_type == 'tag'
        working-directory: clients/tauri/src-tauri/target/release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          ZIP="NoteFast-${TAG#v}-portable-windows.zip"
          # release-please 与 tag 推送并发，等 Release 对象出现（最多 150s）
          for _ in $(seq 1 30); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              break
            fi
            sleep 5
          done
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 未找到" >&2
            exit 1
          fi
          ls -la "$ZIP"
          gh release upload "$TAG" "$ZIP" --clobber
