name: Windows Client

on:
  pull_request:
    paths: ['clients/**']
  push:
    branches: [main]
    paths: ['clients/**']

concurrency:
  group: windows-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web-dist
        run: bun --filter @notefast/web build

      - name: Build engine artifact
        run: bun run build:engine

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/tauri/src-tauri

      - name: Prepare engine resources
        # tauri-build 的 generate_context 会校验 bundle.resources 存在，
        # 必须在任何 cargo 编译前把 dist-engine 复制进 src-tauri/resources/engine
        working-directory: clients/tauri
        run: bun run prepare:engine

      - name: cargo check + clippy
        working-directory: clients/tauri/src-tauri
        run: cargo check && cargo clippy --all-targets -- -D warnings

      - name: Verify engine artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Test-Path packages/server/dist-engine/notefast-server.exe | Out-Null
          Test-Path packages/server/dist-engine/native/vec0.dll | Out-Null
          Test-Path packages/server/dist-engine/web-dist/index.html | Out-Null
          Write-Host "engine artifact OK"

      - name: Build NSIS installer
        working-directory: clients/tauri
        run: |
          bun install
          bun run prepare:engine
          bun run build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: NoteFast-windows-${{ github.ref_name }}
          path: clients/tauri/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
