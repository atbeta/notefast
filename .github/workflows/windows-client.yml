name: Windows Client

# 仅 PR 冒烟（轻量）：cargo check/clippy + engine 构建验证；
# 完整 NSIS 打包只在打 v tag 时由 windows-release.yml 执行
on:
  pull_request:
    paths: ['clients/**']

concurrency:
  group: windows-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # release-please 的版本同步 PR（diff 含 clients/tauri/package.json 等版本文件）
    # 不是真实的客户端改动，跳过冒烟，避免白跑 cargo check/clippy
    if: github.head_ref != 'release-please--branches--main--components--notefast'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web-dist
        run: bun --filter @notefast/web build

      - name: Build engine artifact
        run: bun run build:engine

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/tauri/src-tauri

      - name: Prepare engine resources
        # tauri-build 的 generate_context 会校验 bundle.resources 存在，
        # 必须在任何 cargo 编译前把 dist-engine 复制进 src-tauri/resources/engine
        working-directory: clients/tauri
        run: bun run prepare:engine

      - name: cargo check + clippy
        working-directory: clients/tauri/src-tauri
        run: cargo check && cargo clippy --all-targets -- -D warnings

      - name: Verify engine artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Test-Path packages/server/dist-engine/notefast-server.exe | Out-Null
          Test-Path packages/server/dist-engine/native/vec0.dll | Out-Null
          Test-Path packages/server/dist-engine/web-dist/index.html | Out-Null
          Write-Host "engine artifact OK"
