# NoteFast vault-first 部署（RFC 0005 D2）：笔记文件夹是权威，SQLite 只是可重建索引
#
# 用法：
#   mkdir -p notes && cp docker-compose.vault.yml docker-compose.yml   # 或直接 -f 指定
#   docker compose -f docker-compose.vault.yml up -d
#
# 与 docker-compose.yml 的区别只有两点：挂载 ./notes → /vault，并设 VAULT_PATH=/vault。
# 其余（鉴权、资源限制、只读根文件系统）与默认部署一致。

services:
  notefast:
    image: ${NOTEFAST_IMAGE:-xbeta/notefast:latest}
    ports:
      - '3140:3140'
    environment:
      - PORT=3140
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
      - API_TOKEN=${API_TOKEN:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3140}
      - AI_PROVIDER=${AI_PROVIDER:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
      # 笔记文件夹是权威；引擎按文件内容对账建索引
      - VAULT_PATH=/vault
      # 索引父目录：索引派生到 /app/data/<sha256(vault 路径) 前 12 位>，一个 vault 一个索引。
      # 切到另一个 vault 时不会复用旧索引，也不会污染 notefast_data 卷里的其他数据。
      - NOTEFAST_APP_SUPPORT_DIR=/app/data
      # watcher 后端启动时自动探测：Docker Desktop 的 bind mount 不投递 inotify → 自动轮询。
      # 只有需要强制指定时才设置（true=轮询 / false=原生事件）。
      # - VAULT_USE_POLLING=true
      # - VAULT_POLL_INTERVAL_MS=1000
    volumes:
      # 索引 + 配置（可删可重建）；权威数据在下面的笔记文件夹里
      - notefast_data:/app/data
      # 笔记文件夹：必须可写（NoteFast 端编辑会写回 .md）
      - ./notes:/vault
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /run
    mem_limit: 512m
    cpus: '1.0'
    pids_limit: 200

volumes:
  notefast_data:
