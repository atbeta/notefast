<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
  <head>
    <script>
      // 语言防闪烁：React 挂载前同步把 <html lang> 设为目标语言。
      // 与下方主题脚本同一时机（<head> 内联、module script 之前）。
      // SUPPORTED_CODES 须与 src/i18n/locales.ts 的 SUPPORTED_LOCALES 保持一致。
      (function () {
        try {
          var SUPPORTED_CODES = ['zh-CN', 'en'];
          var boot = window.__NF_PREFS || {};
          var stored = boot.locale || localStorage.getItem('notefast.locale');
          var lang = 'zh-CN';
          if (stored && stored !== 'system') {
            var s = stored.toLowerCase();
            for (var i = 0; i < SUPPORTED_CODES.length; i++) {
              if (SUPPORTED_CODES[i].toLowerCase() === s) { lang = SUPPORTED_CODES[i]; break; }
            }
          } else {
            var nav = (navigator.language || '').toLowerCase();
            if (nav.startsWith('zh')) lang = 'zh-CN';
          }
          document.documentElement.lang = lang;
        } catch (e) { /* ignore — 保持 index.html 静态 zh-CN */ }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="NoteFast — 极速私人笔记，AI 原生知识管理" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="theme-color" content="#191919" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/svg+xml" href="/favicon-dark.svg" media="(prefers-color-scheme: dark)" />

    <!--
      PWA「可安装壳」：仅 manifest + 图标 + meta，不注册 Service Worker（无离线缓存，
      避免内嵌原生壳拿到陈旧资源）。刘海/Home 指示条安全区由 Layout 根容器的
      env(safe-area-inset-*) padding 吸收。
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="NoteFast" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      内联防闪烁脚本：React 挂载前同步读 __NF_PREFS（engine 注入）/
      localStorage + 系统偏好，把 <html data-theme> 设为 light/dark。
      必须放在 <head> 内联且 module script 之前；不要 await / import。
      同步脚本只决定 data-theme（CSS hook），实际状态管理交给 useTheme()。
    -->
    <script>
      (function () {
        try {
          var boot = window.__NF_PREFS || {};
          var stored = boot.theme || localStorage.getItem('notefast.theme');
          var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved;
          if (stored === 'dark') resolved = 'dark';
          else if (stored === 'light') resolved = 'light';
          else resolved = systemDark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', resolved);
        } catch (e) { /* ignore — fallback 到 :root 默认 light */ }
      })();
    </script>

    <!--
      原生壳探测：?native=1 → <html class="native-shell" data-shell="macos|tauri|...">。
      壳层（内嵌 WKWebView / Tauri）加载入口 URL 时带 native 参数，web 据此启用
      窗口拖拽区等桌面化适配；非壳环境无此参数，保持纯浏览器行为。
      必须在 <head> 内联防闪烁，与主题/语言脚本同时机。
      同时标记运行平台 data-os（windows/macos/linux）——Windows 上字体渲染策略
      （Segoe UI 优先）依赖它，见 styles/tokens.css。
    -->
    <script>
      (function () {
        try {
          var m = (location.search || '').match(/[?&]native=(1|macos|tauri|windows|linux)/);
          if (m) {
            document.documentElement.classList.add('native-shell');
            document.documentElement.setAttribute('data-shell', m[1] === '1' ? 'tauri' : m[1]);
          }
          var os = /Windows/i.test(navigator.userAgent)
            ? 'windows'
            : /Mac/i.test(navigator.userAgent)
              ? 'macos'
              : 'linux';
          document.documentElement.setAttribute('data-os', os);
        } catch (e) { /* ignore — 保持默认浏览器行为 */ }
      })();
    </script>

    <!-- 字体为 npm 自托管（@fontsource-variable），见 src/main.tsx；勿恢复外链 CDN -->

    <title>NoteFast</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
