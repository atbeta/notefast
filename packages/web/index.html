<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
  <head>
    <script>
      // 语言防闪烁：React 挂载前同步把 <html lang> 设为目标语言。
      // 与下方主题脚本同一时机（<head> 内联、module script 之前）。
      // SUPPORTED_CODES 须与 src/i18n/locales.ts 的 SUPPORTED_LOCALES 保持一致。
      (function () {
        try {
          var SUPPORTED_CODES = ['zh-CN', 'en'];
          var stored = localStorage.getItem('notefast.locale');
          var lang = 'zh-CN';
          if (stored && stored !== 'system') {
            var s = stored.toLowerCase();
            for (var i = 0; i < SUPPORTED_CODES.length; i++) {
              if (SUPPORTED_CODES[i].toLowerCase() === s) { lang = SUPPORTED_CODES[i]; break; }
            }
          } else {
            var nav = (navigator.language || '').toLowerCase();
            if (nav.startsWith('zh')) lang = 'zh-CN';
          }
          document.documentElement.lang = lang;
        } catch (e) { /* ignore — 保持 index.html 静态 zh-CN */ }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NoteFast — 极速私人笔记，AI 原生知识管理" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="theme-color" content="#191919" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/svg+xml" href="/favicon-dark.svg" media="(prefers-color-scheme: dark)" />

    <!--
      内联防闪烁脚本：React 挂载前同步读 localStorage + 系统偏好，把
      <html data-theme> 设为 light/dark，避免页面先亮后暗的闪烁。
      必须放在 <head> 内联且 module script 之前；不要 await / import。
      同步脚本只决定 data-theme（CSS hook），实际状态管理交给 useTheme()。
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('notefast.theme');
          var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved;
          if (stored === 'dark') resolved = 'dark';
          else if (stored === 'light') resolved = 'light';
          else resolved = systemDark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', resolved);
        } catch (e) { /* ignore — fallback 到 :root 默认 light */ }
      })();
    </script>

    <!--
      原生壳探测：?native=1 → <html class="native-shell" data-shell="macos|tauri|...">。
      壳层（内嵌 WKWebView / Tauri）加载入口 URL 时带 native 参数，web 据此启用
      窗口拖拽区等桌面化适配；非壳环境无此参数，保持纯浏览器行为。
      必须在 <head> 内联防闪烁，与主题/语言脚本同时机。
    -->
    <script>
      (function () {
        try {
          var m = (location.search || '').match(/[?&]native=(1|macos|tauri|windows|linux)/);
          if (m) {
            document.documentElement.classList.add('native-shell');
            document.documentElement.setAttribute('data-shell', m[1] === '1' ? 'tauri' : m[1]);
          }
        } catch (e) { /* ignore — 保持默认浏览器行为 */ }
      })();
    </script>

    <!-- Variable fonts: Inter (UI), Source Serif 4 (reading), JetBrains Mono (code) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <title>NoteFast</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
