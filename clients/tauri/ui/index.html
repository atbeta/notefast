<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NoteFast</title>
  <style>
    :root {
      /* 品牌色（与主 UI tokens.css --primary 同源：#5A74B0 石板靛蓝） */
      --brand: #5a74b0;
      --brand-soft: rgba(90, 116, 176, 0.35);
      --bg: #15161a;
      --bg-glow: #1b1d24;
      --fg: #e8e9ed;
      --fg-dim: rgba(232, 233, 237, 0.45);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --brand: #5a74b0;
        --brand-soft: rgba(90, 116, 176, 0.28);
        --bg: #f4f5f9;
        --bg-glow: #eceef5;
        --fg: #26272e;
        --fg-dim: rgba(38, 39, 46, 0.45);
      }
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(ellipse 80% 60% at 50% -10%, var(--bg-glow) 0%, transparent 60%),
        var(--bg);
      color: var(--fg);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }

    .boot {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      animation: bootIn 0.5s ease-out both;
    }
    @keyframes bootIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── Logo：三条横线（品牌标识），整体浮起 + 呼吸光晕 ── */
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, rgba(90, 116, 176, 0.16), rgba(90, 116, 176, 0.05));
      border: 1px solid rgba(90, 116, 176, 0.22);
      animation: glow 2.6s ease-in-out infinite;
    }
    .logo svg {
      width: 34px;
      height: 34px;
      overflow: visible;
    }
    .logo .line {
      stroke: var(--brand);
      stroke-width: 4;
      stroke-linecap: round;
      fill: none;
      stroke-dasharray: 34;
      stroke-dashoffset: 34;
      animation: draw 0.9s ease-out forwards;
    }
    .logo .line:nth-child(2) { animation-delay: 0.12s; }
    .logo .line:nth-child(3) { animation-delay: 0.24s; }
    @keyframes draw {
      to { stroke-dashoffset: 0; }
    }
    @keyframes glow {
      0%, 100% {
        box-shadow: 0 0 0 0 var(--brand-soft), 0 8px 32px rgba(0, 0, 0, 0.25);
      }
      50% {
        box-shadow: 0 0 0 10px transparent, 0 8px 40px rgba(0, 0, 0, 0.3);
      }
    }

    /* ── Loading 指示：三颗跳动小点 ── */
    .dots {
      display: flex;
      gap: 7px;
      height: 8px;
      align-items: center;
    }
    .dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--brand);
      opacity: 0.35;
      animation: dot 1.2s ease-in-out infinite;
    }
    .dots span:nth-child(2) { animation-delay: 0.18s; }
    .dots span:nth-child(3) { animation-delay: 0.36s; }
    @keyframes dot {
      0%, 100% { transform: translateY(0); opacity: 0.35; }
      35% { transform: translateY(-5px); opacity: 1; }
    }

    /* ── 文案 ── */
    .msg {
      margin: 0;
      font-size: 13px;
      letter-spacing: 0.04em;
      color: var(--fg-dim);
    }

    /* ── 启动失败（app.js 注入） ── */
    .err {
      color: #f87171;
      max-width: 420px;
      line-height: 1.6;
      font-size: 12.5px;
    }
  </style>
</head>
<body>
  <div class="boot" id="boot">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 64 64" fill="none">
        <path class="line" d="M16 22h32" />
        <path class="line" d="M16 32h32" />
        <path class="line" d="M16 42h22" />
      </svg>
    </div>
    <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
    <p class="msg" id="msg">正在启动 NoteFast</p>
  </div>
  <script src="app.js"></script>
</body>
</html>
