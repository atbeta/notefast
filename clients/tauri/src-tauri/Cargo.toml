[package]
name = "notefast-tauri"
version = "0.81.0"
description = "NoteFast Windows 桌面客户端（Tauri 壳 + 内嵌 server engine）"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "notefast_tauri_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
